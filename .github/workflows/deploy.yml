name: Deploy

on:
  push:
    branches: [main]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install development dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run pytest
        run: python -m pytest -v

  deploy:
    name: Deploy
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Write commit SHA to version.txt
        run: echo "${{ github.sha }}" > app/version.txt

      - name: Install Railway CLI
        run: npm install -g @railway/cli@5.71.0

      - name: Deploy to Railway
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          echo "Deploying commit ${{ github.sha }} to Railway service ${{ vars.RAILWAY_SERVICE }}"
          railway up --service="${{ vars.RAILWAY_SERVICE }}" --ci

  smoke-test:
    name: Smoke Test
    needs: deploy
    runs-on: ubuntu-latest

    steps:
      - name: Smoke test deployed /health endpoint
        env:
          APP_URL: ${{ vars.APP_URL }}
          EXPECTED_VERSION: ${{ github.sha }}
        run: |
          # Normalize APP_URL defensively before building the health URL.
          # The repository variable may accidentally contain surrounding
          # quotes, leading/trailing whitespace, or CR/LF characters, which
          # would make curl reject the URL as malformed.
          APP_URL="${APP_URL//$'\r'/}"
          APP_URL="${APP_URL//$'\n'/}"
          APP_URL="$(printf '%s' "$APP_URL" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
          if [ "${#APP_URL}" -ge 2 ]; then
            first="${APP_URL:0:1}"
            last="${APP_URL: -1}"
            if [ "$first" = '"' ] && [ "$last" = '"' ]; then
              APP_URL="${APP_URL:1:$((${#APP_URL} - 2))}"
            elif [ "$first" = "'" ] && [ "$last" = "'" ]; then
              APP_URL="${APP_URL:1:$((${#APP_URL} - 2))}"
            fi
          fi
          APP_URL="$(printf '%s' "$APP_URL" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
          # Remove a single trailing slash so exactly one "/health" is appended.
          APP_URL="${APP_URL%/}"

          HEALTH_URL="${APP_URL}/health"

          echo "Smoke testing $HEALTH_URL"
          echo "Expected version: $EXPECTED_VERSION"

          MAX_ATTEMPTS=30
          SLEEP_SECONDS=10

          for attempt in $(seq 1 "$MAX_ATTEMPTS"); do
            echo "Attempt $attempt/$MAX_ATTEMPTS"

            # Keep stderr in RESPONSE so curl errors are not hidden.
            RESPONSE=$(curl -4 -sS \
              --connect-timeout 10 \
              --max-time 20 \
              -w "\n%{http_code}" \
              "$HEALTH_URL" 2>&1) || true

            HTTP_CODE=$(printf '%s' "$RESPONSE" | tail -n 1)
            BODY=$(printf '%s' "$RESPONSE" | sed '$d')

            echo "HTTP $HTTP_CODE"
            echo "Response: $BODY"

            if [ "$HTTP_CODE" = "200" ]; then
              STATUS=$(printf '%s' "$BODY" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('status',''))" 2>/dev/null || echo "")
              VERSION=$(printf '%s' "$BODY" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('version',''))" 2>/dev/null || echo "")

              echo "status=$STATUS"
              echo "version=$VERSION"

              if [ "$STATUS" = "ok" ] && [ "$VERSION" = "$EXPECTED_VERSION" ]; then
                echo "Smoke test passed: status=ok version=$EXPECTED_VERSION"
                exit 0
              fi

              echo "Health endpoint responded, but status/version did not match expected values."
            fi

            if [ "$attempt" -lt "$MAX_ATTEMPTS" ]; then
              echo "Waiting ${SLEEP_SECONDS}s before retry..."
              sleep "$SLEEP_SECONDS"
            fi
          done

          echo "Smoke test failed."
          echo "Expected URL: $HEALTH_URL"
          echo "Expected version: $EXPECTED_VERSION"
          exit 1