name: Deploy

on:
  push:
    branches: [main]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install development dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run pytest
        run: python -m pytest -v

  deploy:
    name: Deploy
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Write commit SHA to version.txt
        run: echo "${{ github.sha }}" > app/version.txt

      - name: Install Railway CLI
        run: npm install -g @railway/cli@5.71.0

      - name: Deploy to Railway
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          echo "Deploying commit ${{ github.sha }} to Railway service ${{ vars.RAILWAY_SERVICE }}"
          railway up --service="${{ vars.RAILWAY_SERVICE }}" --ci

  smoke-test:
    name: Smoke Test
    needs: deploy
    runs-on: ubuntu-latest

    steps:
      - name: Smoke test deployed /health endpoint
        run: |
          echo "Smoke testing ${{ vars.APP_URL }}/health"
          MAX_ATTEMPTS=30
          SLEEP_SECONDS=10
          for attempt in $(seq 1 $MAX_ATTEMPTS); do
            echo "Attempt $attempt/$MAX_ATTEMPTS"
            RESPONSE=$(curl -s -w "\n%{http_code}" "${{ vars.APP_URL }}/health" || true)
            HTTP_CODE=$(echo "$RESPONSE" | tail -n 1)
            BODY=$(echo "$RESPONSE" | sed '$d')
            echo "HTTP $HTTP_CODE: $BODY"

            if [ "$HTTP_CODE" = "200" ]; then
              STATUS=$(echo "$BODY" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('status',''))" 2>/dev/null || echo "")
              VERSION=$(echo "$BODY" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('version',''))" 2>/dev/null || echo "")
              echo "status=$STATUS version=$VERSION"
              if [ "$STATUS" = "ok" ] && [ "$VERSION" = "${{ github.sha }}" ]; then
                echo "Smoke test passed: status=ok version=${{ github.sha }}"
                exit 0
              fi
            fi

            if [ "$attempt" -lt "$MAX_ATTEMPTS" ]; then
              sleep "$SLEEP_SECONDS"
            fi
          done

          echo "Smoke test failed: /health did not return status=ok version=${{ github.sha }}"
          exit 1
